<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Architecture: WeChat and WeCom push encrypted XML to a serverless function, which verifies, decrypts, parses, applies bookkeeping, and replies; records are stored in Feishu Bitable.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
    <style>
      .card  { fill:#f6f8fa; stroke:#d0d7de; stroke-width:1.2; }
      .lane  { fill:#ffffff; stroke:#d0d7de; stroke-width:1.2; stroke-dasharray:4 4; }
      .step  { fill:#ffffff; stroke:#afb8c1; stroke-width:1.2; }
      .t     { font-family:ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC',sans-serif; fill:#1f2328; }
      .t-sm  { font-family:ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC',sans-serif; fill:#59636e; }
      .mono  { font-family:ui-monospace,'Cascadia Code',Consolas,monospace; fill:#59636e; }
      .num   { font-family:ui-sans-serif,-apple-system,'Segoe UI',sans-serif; fill:#0969da; font-weight:700; }
      .link  { stroke:#8c959f; stroke-width:1.4; fill:none; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <!-- clients -->
  <text class="t-sm" x="32" y="46" font-size="12" letter-spacing="0.6">CLIENTS</text>

  <rect class="card" x="32" y="58" width="196" height="68" rx="8"/>
  <text class="t" x="48" y="84" font-size="13.5" font-weight="600">微信 / 企业微信</text>
  <text class="t-sm" x="48" y="104" font-size="11.5">自建应用，或微信插件入口</text>

  <rect class="card" x="32" y="196" width="196" height="68" rx="8"/>
  <text class="t" x="48" y="222" font-size="13.5" font-weight="600">公众号 / 测试号</text>
  <text class="t-sm" x="48" y="242" font-size="11.5">安全模式或明文模式</text>

  <text class="t-sm" x="32" y="296" font-size="11.5">消息形如</text>
  <rect x="32" y="304" width="196" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text class="mono" x="44" y="324" font-size="12">25 午饭</text>

  <!-- function -->
  <rect class="lane" x="272" y="46" width="352" height="330" rx="10"/>
  <text class="t" x="288" y="70" font-size="13" font-weight="600">云函数（事件函数 + 函数 URL）</text>
  <text class="t-sm" x="288" y="88" font-size="11">零依赖，5 秒内必须回包</text>

  <rect class="step" x="290" y="102" width="316" height="38" rx="6"/>
  <text class="num" x="302" y="126" font-size="11">1</text>
  <text class="t" x="318" y="126" font-size="12.5">验签</text>
  <text class="mono" x="358" y="126" font-size="11">msg_signature / signature</text>

  <rect class="step" x="290" y="150" width="316" height="38" rx="6"/>
  <text class="num" x="302" y="174" font-size="11">2</text>
  <text class="t" x="318" y="174" font-size="12.5">解密</text>
  <text class="mono" x="358" y="174" font-size="11">AES-256-CBC + PKCS#7</text>

  <rect class="step" x="290" y="198" width="316" height="38" rx="6"/>
  <text class="num" x="302" y="222" font-size="11">3</text>
  <text class="t" x="318" y="222" font-size="12.5">解析</text>
  <text class="mono" x="358" y="222" font-size="11">金额 · 类型 · 分类 · 备注</text>

  <rect class="step" x="290" y="246" width="316" height="38" rx="6"/>
  <text class="num" x="302" y="270" font-size="11">4</text>
  <text class="t" x="318" y="270" font-size="12.5">业务</text>
  <text class="mono" x="358" y="270" font-size="11">记一笔 / 汇总 / 删除</text>

  <rect class="step" x="290" y="294" width="316" height="38" rx="6"/>
  <text class="num" x="302" y="318" font-size="11">5</text>
  <text class="t" x="318" y="318" font-size="12.5">回包</text>
  <text class="mono" x="358" y="318" font-size="11">明文或加密 XML，按请求还原</text>

  <!-- storage -->
  <rect class="card" x="656" y="120" width="192" height="80" rx="8"/>
  <text class="t" x="672" y="148" font-size="13.5" font-weight="600">飞书多维表格</text>
  <text class="t-sm" x="672" y="168" font-size="11.5">记录 + 条件查询 + 删除</text>
  <text class="mono" x="672" y="186" font-size="11">open.feishu.cn</text>

  <rect class="card" x="656" y="214" width="192" height="62" rx="8"/>
  <text class="t" x="672" y="240" font-size="13.5" font-weight="600">本地备用后端</text>
  <text class="mono" x="672" y="260" font-size="11">json / memory</text>

  <!-- links left -->
  <path class="link" d="M 228 92 L 268 92" marker-end="url(#arrow)"/>
  <path class="link" d="M 228 226 L 248 226 L 248 200 L 266 200" marker-end="url(#arrow)"/>

  <!-- links right -->
  <path class="link" d="M 624 262 L 640 262 L 640 160 L 652 160" marker-end="url(#arrow)"/>

  <!-- tools -->
  <rect class="card" x="32" y="396" width="816" height="52" rx="8"/>
  <text class="t" x="48" y="418" font-size="12.5" font-weight="600">本地工具链</text>
  <text class="mono" x="48" y="436" font-size="11">sim 模拟推送　·　check 上线自检　·　ping 远程三步探测　·　pack 打包上传　·　test 149 项断言（不联网）</text>

  <text class="t-sm" x="656" y="300" font-size="11">存储适配器可替换</text>
</svg>
